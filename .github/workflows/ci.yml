name: CI

# 每次提交 / PR 都会执行；也可在 Actions 页面手动触发
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支连续提交时，取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 可改成具体版本，例如 '3.47.5'，以获得完全可复现的构建
  FLUTTER_CHANNEL: stable
  # 产物命名用的产品名（取仓库名，例如 keep-github-update）
  PRODUCT_NAME: ${{ github.event.repository.name }}

jobs:
  # ————————————— 1. 静态分析 + 单元测试 —————————————
  test:
    name: 单元测试与静态分析
    runs-on: windows-latest
    # 防止个别用例卡住时把任务拖到默认的 6 小时
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析（零容忍）
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  # ————————————— 2. Windows 端（GUI + CLI）—————————————
  build-windows:
    name: 构建 Windows 端（GUI + CLI）
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 GUI（Release）
        run: flutter build windows --release

      - name: 构建 CLI（单文件 exe，注入版本号）
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          dart compile exe --define=GRKU_VERSION=$ver bin/grku.dart -o build/grku.exe
          build/grku.exe --version

      # 产物命名规范：<产品名>-<版本号>-<架构>-<系统>-<位数>.<扩展名>
      - name: 按命名规范整理产物
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          $p = if ($env:PRODUCT_NAME) { $env:PRODUCT_NAME } else { 'keep-github-update' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "dist/$p-$ver-x86_64-windows-64.zip" -Force
          Copy-Item build/grku.exe "dist/$p-$ver-x86_64-windows-64.exe" -Force
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: grku-windows
          if-no-files-found: error
          path: dist/

  # ————————————— 3. Android 端（签名 + 分 ABI + 通用包）—————————————
  build-android:
    name: 构建 Android 端（签名 + 分 ABI + 通用包）
    # 固定 24.04：ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 60
    # 签名信息放在 Environment secrets 里，必须声明同名 environment 才能读到；
    # 若你把它们改成了 Repository secrets，删掉这行即可。
    environment: compile-Android
    env:
      # 发布签名：在仓库 Settings → Secrets and variables → Actions 中配置
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GRKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GRKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GRKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 接受 Android SDK 许可
        run: yes | flutter doctor --android-licenses || true

      # 本地开发使用腾讯云镜像（services.gradle.org 在部分网络不可达），
      # GitHub Runner 上改回官方源更稳定
      - name: CI 使用官方 Gradle 源
        run: sed -i 's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#g' android/gradle/wrapper/gradle-wrapper.properties

      - name: 拉取依赖
        run: flutter pub get

      - name: 检查签名用的 Secrets 是否可见（只打印有无，不打印内容）
        run: |
          echo "（Environment secrets 需与 job 声明的 environment 同名，当前为 compile-Android）"
          for kv in \
            "ANDROID_KEYSTORE_BASE64:${ANDROID_KEYSTORE_BASE64}" \
            "ANDROID_KEYSTORE_PASSWORD:${GRKU_KEYSTORE_PASSWORD}" \
            "ANDROID_KEY_ALIAS:${GRKU_KEY_ALIAS}" \
            "ANDROID_KEY_PASSWORD:${GRKU_KEY_PASSWORD}"; do
            k="${kv%%:*}"; v="${kv#*:}"
            if [ -n "$v" ]; then echo "  $k = 已配置"; else echo "  $k = 未配置"; fi
          done

      - name: 准备发布签名（已配置密钥时解码，未配置时用 debug 签名）
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/grku-release.jks"
            if [ ! -s "$RUNNER_TEMP/grku-release.jks" ]; then
              echo "::error::密钥解码失败，请检查 ANDROID_KEYSTORE_BASE64"
              exit 1
            fi
            echo "GRKU_KEYSTORE_PATH=$RUNNER_TEMP/grku-release.jks" >> "$GITHUB_ENV"
            echo "✓ 已读取仓库密钥，本次将使用正式签名构建"
          else
            echo "::warning::未读取到 ANDROID_KEYSTORE_BASE64，本次 APK 将使用 debug 签名（仅用于验证构建，不会发布）"
            echo "排查：Environment secrets 需与 job 声明的 environment 同名（当前为 compile-Android）；"
            echo "      若密钥放在 Repository secrets，请删除 job 里的 environment 声明。"
          fi

      - name: 构建分 ABI 包（arm32 / arm64 / x86_64）
        run: flutter build apk --release --split-per-abi

      - name: 构建通用包（合并）
        run: flutter build apk --release

      - name: 校验签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -n 5

      # 产物命名规范：<产品名>-<版本号>-<架构>-<系统>-<位数>.<扩展名>
      - name: 按命名规范整理产物
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          P="${PRODUCT_NAME:-keep-github-update}"
          mkdir -p dist
          SRC=build/app/outputs/flutter-apk
          cp "$SRC/app-armeabi-v7a-release.apk" "dist/$P-$V-armeabi-v7a-android-32.apk"
          cp "$SRC/app-arm64-v8a-release.apk"    "dist/$P-$V-arm64-v8a-android-64.apk"
          cp "$SRC/app-x86_64-release.apk"       "dist/$P-$V-x86_64-android-64.apk"
          cp "$SRC/app-release.apk"              "dist/$P-$V-universal-android-multi.apk"
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: grku-android
          if-no-files-found: error
          path: dist/*.apk

  # ————————————— 4. 按版本号发布 Release（含 changelog）—————————————
  release:
    name: 发布 Release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-android]
    # 只在 main 分支（或手动触发）发布，PR 不发布
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 20
    # 与 build-android 一致：需要读取环境级 secret 判断是否具备发布条件
    environment: compile-Android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要完整历史与 tag，才能生成两次发布之间的 changelog
          fetch-depth: 0

      - name: 读取版本号（pubspec.yaml → tag）
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "本次版本：v$V"

      - name: 是否具备发布条件（需要签名密钥）
        id: gate
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，跳过发布（避免发布 debug 签名的 APK）"
          fi

      - name: 下载构建产物
        if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: 汇总发布文件
        if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p release
          cp dist/grku-android/*.apk release/
          cp dist/grku-windows/* release/
          ls -lh release

      - name: 检查该版本是否已发布过
        if: steps.gate.outputs.ok == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已存在 $TAG 的 Release，跳过（如需重发请先手动删除该 Release 与 tag）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release（附 changelog 与全部产物）
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          if [ -n "$PREV" ]; then
            echo "changelog 范围：$PREV..$TAG"
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV"
          else
            echo "首次发布，changelog 列出全部提交"
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
